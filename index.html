function PageSlider({ value, onChange, min = 1, max = 30 }) {
  const pct = (value - min) / (max - min) * 100;
  return (
    <div className="w-full">
      <div className="relative h-6 flex items-center">
        <div className="absolute inset-x-0 h-1.5 rounded-full bg-white/10"></div>
        <div
          className="absolute h-1.5 rounded-full"
          style={{ left: 0, width: `${pct}%`, backgroundColor: '#FF5656' }}>
        </div>
        <div
          className="absolute w-5 h-5 rounded-full border-2 border-white shadow-md pointer-events-none"
          style={{ left: `calc(${pct}% - 10px)`, backgroundColor: '#FF5656' }}>
        </div>
        <input
          type="range"
          min={min}
          max={max}
          step={1}
          value={value}
          onChange={(e) => onChange(Number(e.target.value))}
          className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
          aria-label="Number of pages" />
        
      </div>
      <div className="flex justify-between mt-2 text-[12px] text-white/45">
        <span>{min}</span>
        <span>{max}</span>
      </div>
    </div>);

}

function CalculatorSection() {
  const [serviceType, setServiceType] = React.useState('both');
  const [pages, setPages] = React.useState(5);
  const [needContent, setNeedContent] = React.useState(false);
  const [needSEO, setNeedSEO] = React.useState(false);
  const [timeline, setTimeline] = React.useState('regular');

  const calculatePrice = () => {
    const tiers = {
      design: { base: 399, perPage: 100 },
      development: { base: 199, perPage: 100 },
      both: { base: 499, perPage: 200 }
    };
    const { base, perPage } = tiers[serviceType];
    let total = Math.max(base, base + (pages - 1) * perPage);
    if (needContent) total += pages * 50;
    if (needSEO) total += pages * 50;
    if (timeline === 'rush') total += pages * 100;
    if (timeline === 'fast') total += pages * 25;
    return total;
  };

  const calculateAgencyCost = () => {
    const perPage = serviceType === 'both' ? 1000 : 400;
    return 8000 + (pages - 1) * perPage;
  };

  const calculateFreelancerCost = () => {
    const perPage = serviceType === 'both' ? 500 : 200;
    return 3000 + (pages - 1) * perPage;
  };

  const fmt = (n) => `$${n.toLocaleString()}`;

  return (
    <section
      id="calculator-section"
      className="w-full bg-black px-4 md:px-16 py-16 md:py-28"
      style={{ fontFamily: 'Inter, sans-serif' }}>

            Get premium website within your budget

            {/* Service Type */}
            <div className="pb-6">
              <h3 className="text-white text-[17px] md:text-lg font-medium mb-3">

    });

function ProjectCard({ project, index, total }) {
  const ref = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const targetScale = 1 - (total - 1 - index) * 0.03;
  const stickyTop = 96 + index * 28;

  React.useEffect(() => {
    const onScroll = () => {
      if (!ref.current) return;
      const rect = ref.current.getBoundingClientRect();
      const containerEl = ref.current.parentElement;
      const containerRect = containerEl.getBoundingClientRect();
      // Progress = how far past the sticky point we've scrolled within the container
      const stickyOffset = stickyTop;
      const passed = stickyOffset - containerRect.top;
      const total = containerRect.height - rect.height;
      let progress = total > 0 ? passed / total : 0;
      progress = Math.max(0, Math.min(1, progress));
      // Only the upper cards shrink (cards below the current one)
      const isLastCard = index === PROJECTS.length - 1;
      if (isLastCard) {
        setScale(1);
      } else {
        const next = 1 + (targetScale - 1) * progress;
        setScale(next);
      }
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [index, targetScale, stickyTop]);

  return (
    <div className="h-[85vh]" style={{ marginBottom: index === total - 1 ? 0 : 0 }}>
      <div
        ref={ref}
        className="sticky"
        style={{
          top: `${stickyTop}px`,
          transform: `scale(${scale})`,
          transformOrigin: 'top center',
          transition: 'transform 0.1s linear'
        }}>
        
        <div
          className="liquid-glass relative p-4 sm:p-6 md:p-8"
          style={{
            backgroundColor: 'rgba(12,12,12,0.45)',
            backdropFilter: 'blur(24px) saturate(140%)',

                  color: '#D7E2EA',
                  fontSize: 'clamp(3rem, 10vw, 140px)',
                  fontFamily: "'Kanit', sans-serif"
                }}>
                
                {project.num}
              </span>
              <div className="flex flex-col gap-1 sm:gap-2 min-w-0">
